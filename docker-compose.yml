
services:
  # ─── Python Backend (mock + naming pipeline) ───────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anilog-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    environment:
      - ANI_LOG_CHROMA_HOST=chromadb
      - ANI_LOG_CHROMA_PORT=8000
      - ANI_LOG_OLLAMA_HOST=http://ollama:11434
      - ANI_LOG_ZMQ_CAPTURE_PORT=5555
      - ANI_LOG_ZMQ_RESULT_PORT=5556
    networks:
      - anilog-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 10

  # ─── ChromaDB Vector Database (optional; profile=ml) ───────
  chromadb:
    image: chromadb/chroma:latest
    container_name: anilog-chromadb
    profiles: ["ml"]
    ports:
      - "8100:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
      - IS_PERSISTENT=TRUE
    networks:
      - anilog-net

  # ─── Ollama Local LLM (optional; profile=ml) ───────────────
  ollama:
    image: ollama/ollama:latest
    container_name: anilog-ollama
    profiles: ["ml"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - anilog-net
  # ─── Next.js Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anilog-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - anilog-net

volumes:
  chroma-data:
  ollama-data:

networks:
  anilog-net:
    driver: bridge
